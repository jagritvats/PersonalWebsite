# TLS is terminated by the shared Traefik edge; this only speaks plain HTTP
# on the Docker network.

# Agents that ask for Markdown first (Accept: text/markdown) get llms.txt
# instead of the HTML page.
map $http_accept $wants_markdown {
    default            0;
    "~^text/markdown"  1;
    "~^text/x-markdown" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik forwards the public host; keep redirects relative so nginx
    # never sends visitors to http:// or the container's own port.
    absolute_redirect off;
    server_tokens off;

    # Without this, llms.txt and resume.json go out with no charset and
    # non-ASCII text (résumé) can be misread.
    charset utf-8;
    charset_types text/plain text/markdown text/xml application/json
                  application/manifest+json application/xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json text/plain
               image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fonts and images rarely change.
    location ~* \.(woff2|png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS/JS aren't fingerprinted, so keep their cache short.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tell crawlers and agents where the machine-readable profile lives,
    # even if they only send a HEAD request.
    location = / {
        add_header Link '</llms.txt>; rel="alternate"; type="text/markdown", </resume.json>; rel="alternate"; type="application/json", </sitemap.xml>; rel="sitemap"' always;
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        if ($wants_markdown) {
            rewrite ^ /llms.txt last;
        }
        try_files /index.html =404;
    }

    # Common guesses for a Markdown version of the page.
    location ~ ^/(index\.md|llms-full\.txt)$ {
        rewrite ^ /llms.txt last;
    }

    location = /llms.txt {
        default_type text/markdown;
        types { }
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /site.webmanifest {
        # A types block replaces the whole MIME map, so keep it scoped here.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
