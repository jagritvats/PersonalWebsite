# TLS is terminated by the shared Traefik edge; this only speaks plain HTTP
# on the Docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik forwards the public host; keep redirects relative so nginx
    # never sends visitors to http:// or the container's own port.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json text/plain
               image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fonts and images rarely change.
    location ~* \.(woff2|png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS/JS aren't fingerprinted, so keep their cache short.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
