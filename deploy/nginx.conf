# TLS is terminated by the shared Traefik edge; this only speaks plain HTTP
# on the Docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik forwards the public host; keep redirects relative so nginx
    # never sends visitors to http:// or the container's own port.
    absolute_redirect off;
    server_tokens off;

    # Every file is UTF-8 (llms.txt has "résumé" in it); say so on text types.
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript
                  application/json application/xml application/atom+xml image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json text/plain
               image/svg+xml application/xml text/xml application/atom+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Atom feed for /writing/ (nginx would call any .xml file text/xml).
    location = /feed.xml {
        types { application/atom+xml xml; }
    }

    # Fonts and images rarely change.
    location ~* \.(woff2|png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS/JS aren't fingerprinted, so keep their cache short.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pages are folders with an index.html (/writing/, /writing/<post>/);
    # /writing without the slash gets a relative redirect to /writing/.
    location / {
        try_files $uri $uri/ =404;
    }
}
