# Response headers for every location. nginx drops server-level add_header lines
# in any location that has its own add_header, so nginx.conf includes this file in
# the server block and again in each location that adds headers.
#
# The script-src hash is the inline theme script in _includes/partials/head-assets.njk.
# `npm run build` checks every inline script against this file and fails if one
# isn't listed, so edit the script, rebuild, and paste the hash it prints here.
# static.cloudflareinsights.com / cloudflareinsights.com: Cloudflare Web Analytics.

add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-aSolAlrBK2+vVoNyyhAFbd1rOKR+70RJV5Grt91cED8=' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cache-Control $cache_control always;
